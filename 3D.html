<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>3D Carton Loading System</title>

<style>
body{
margin:0;
overflow:hidden;
font-family:Arial,sans-serif;
background:#f5f5f5;
}

#panel{
position:absolute;
top:10px;
left:10px;
width:320px;
background:white;
padding:15px;
border-radius:10px;
box-shadow:0 0 10px rgba(0,0,0,.2);
z-index:100;
max-height:90vh;
overflow:auto;
}

input{
width:60px;
margin:2px;
}

button{
padding:8px;
margin-top:5px;
cursor:pointer;
}

table{
width:100%;
border-collapse:collapse;
margin-top:10px;
}

th,td{
border:1px solid #ddd;
padding:4px;
text-align:center;
}

#result{
margin-top:10px;
font-size:14px;
}
</style>
</head>

<body>

<div id="panel">

<h2>Container</h2>

Length
<input id="cL" type="number" value="20">

Width
<input id="cW" type="number" value="10">

Height
<input id="cH" type="number" value="10">

<h3>Cartons</h3>

<table id="cartonTable">

<tr>
<th>L</th>
<th>W</th>
<th>H</th>
<th>Qty</th>
</tr>

<tr>
<td><input value="2"></td>
<td><input value="2"></td>
<td><input value="2"></td>
<td><input value="30"></td>
</tr>

</table>

<button onclick="addCartonRow()">
Add Carton Type
</button>

<button onclick="optimizeLoading()">
Optimize Loading
</button>

<div id="result"></div>

</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128/examples/js/controls/OrbitControls.js"></script>

<script>

const scene = new THREE.Scene();

scene.background =
new THREE.Color(0xf0f0f0);

const camera =
new THREE.PerspectiveCamera(
60,
window.innerWidth/window.innerHeight,
0.1,
1000
);

camera.position.set(
30,
20,
30
);

const renderer =
new THREE.WebGLRenderer({
antialias:true
});

renderer.setSize(
window.innerWidth,
window.innerHeight
);

document.body.appendChild(
renderer.domElement
);

const controls =
new THREE.OrbitControls(
camera,
renderer.domElement
);

controls.enableDamping = true;

const ambient =
new THREE.AmbientLight(
0xffffff,
0.8
);

scene.add(ambient);

const directional =
new THREE.DirectionalLight(
0xffffff,
1
);

directional.position.set(
20,
20,
20
);

scene.add(directional);

function addCartonRow(){

const table =
document.getElementById(
"cartonTable"
);

const row =
table.insertRow();

row.innerHTML = `
<td><input value="2"></td>
<td><input value="2"></td>
<td><input value="2"></td>
<td><input value="10"></td>
`;

}

function clearObjects(){

for(
let i = scene.children.length-1;
i >= 0;
i--
){

const obj =
scene.children[i];

if(
obj.type !== "AmbientLight" &&
obj.type !== "DirectionalLight"
){
scene.remove(obj);
}

}

}

function optimizeLoading(){

clearObjects();

const cL =
parseFloat(
document.getElementById("cL").value
);

const cW =
parseFloat(
document.getElementById("cW").value
);

const cH =
parseFloat(
document.getElementById("cH").value
);

/* OPEN CONTAINER */

const floor =
new THREE.Mesh(
new THREE.BoxGeometry(
cL,
0.3,
cW
),
new THREE.MeshPhongMaterial({
color:0x6b4423
})
);

floor.position.y =
-cH/2;

scene.add(floor);

const leftWall =
new THREE.Mesh(
new THREE.BoxGeometry(
0.3,
cH,
cW
),
new THREE.MeshPhongMaterial({
color:0x8B4513,
transparent:true,
opacity:.4
})
);

leftWall.position.x =
-cL/2;

scene.add(leftWall);

const rightWall =
new THREE.Mesh(
new THREE.BoxGeometry(
0.3,
cH,
cW
),
new THREE.MeshPhongMaterial({
color:0x8B4513,
transparent:true,
opacity:.4
})
);

rightWall.position.x =
cL/2;

scene.add(rightWall);

const backWall =
new THREE.Mesh(
new THREE.BoxGeometry(
cL,
cH,
0.3
),
new THREE.MeshPhongMaterial({
color:0x8B4513,
transparent:true,
opacity:.4
})
);

backWall.position.z =
-cW/2;

scene.add(backWall);

const frontWall =
new THREE.Mesh(
new THREE.BoxGeometry(
cL,
cH,
0.3
),
new THREE.MeshPhongMaterial({
color:0x8B4513,
transparent:true,
opacity:.4
})
);

frontWall.position.z =
cW/2;

scene.add(frontWall);

/* CARTON TYPES */

const rows =
document
.getElementById(
"cartonTable"
)
.rows;

const colors = [
0xff6b6b,
0x4ecdc4,
0xfeca57,
0x5f27cd,
0x10ac84,
0xee5253,
0x54a0ff
];

let currentX =
-cL/2;

let currentY =
-cH/2;

let currentZ =
-cW/2;

let totalUsed = 0;
let totalPlaced = 0;

for(
let r=1;
r<rows.length;
r++
){

const cells =
rows[r].cells;

const bL =
parseFloat(
cells[0]
.querySelector("input")
.value
);

const bW =
parseFloat(
cells[1]
.querySelector("input")
.value
);

const bH =
parseFloat(
cells[2]
.querySelector("input")
.value
);

const qty =
parseInt(
cells[3]
.querySelector("input")
.value
);

if(
bL>cL ||
bW>cW ||
bH>cH
){
alert(
`Carton type ${r}
is bigger than container`
);
continue;
}

for(
let q=0;
q<qty;
q++
){

if(
currentX + bL >
cL/2
){
currentX =
-cL/2;

currentZ += bW;
}

if(
currentZ + bW >
cW/2
){
currentZ =
-cW/2;

currentY += bH;
}

if(
currentY + bH >
cH/2
){
break;
}

const carton =
new THREE.Mesh(
new THREE.BoxGeometry(
bL,
bH,
bW
),
new THREE.MeshPhongMaterial({
color:
colors[
r %
colors.length
]
})
);

carton.position.set(
currentX + bL/2,
currentY + bH/2,
currentZ + bW/2
);

scene.add(carton);

const edge =
new THREE.LineSegments(
new THREE.EdgesGeometry(
carton.geometry
),
new THREE.LineBasicMaterial({
color:0x000000
})
);

edge.position.copy(
carton.position
);

scene.add(edge);

currentX += bL;

totalPlaced++;

totalUsed +=
bL*bW*bH;

}

}

const containerVolume =
cL*cW*cH;

const utilization =
(
(totalUsed /
containerVolume)
*100
).toFixed(2);

document.getElementById(
"result"
).innerHTML =

`
<b>Placed Cartons:</b> ${totalPlaced}<br>
<b>Used Volume:</b> ${totalUsed}<br>
<b>Container Volume:</b> ${containerVolume}<br>
<b>Utilization:</b> ${utilization}%<br>
`;

}

optimizeLoading();

function animate(){

requestAnimationFrame(
animate
);

controls.update();

renderer.render(
scene,
camera
);

}

animate();

window.addEventListener(
'resize',
()=>{

camera.aspect =
window.innerWidth/
window.innerHeight;

camera.updateProjectionMatrix();

renderer.setSize(
window.innerWidth,
window.innerHeight
);

}
);

</script>
</body>
</html>
